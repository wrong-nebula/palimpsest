<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Synchronized 30-layer historical map, 1 m bare-earth LiDAR Red-Relief, and multi-epoch aerial atlas across Japan." />
    <title>PALIMPSEST — 30-Layer Historical, LiDAR &amp; Vanished Shrine/Temple/Haison Atlas</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #111312;
        --panel: #151816;
        --panel-2: #1b1f1c;
        --border: rgba(237, 234, 226, 0.10);
        --border-strong: rgba(237, 234, 226, 0.20);
        --text: #edeae2;
        --muted: #969d97;
        --emerald: #52ad8c;
        --amber: #d49b4b;
        --crimson: #cf5648;
        --violet: #a58fd6;
        --cyan: #6ba8c9;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-jp: "Shippori Mincho", "Hiragino Mincho ProN", serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      }
      *, *::before, *::after { box-sizing: border-box; }
      ::selection { background: rgba(207, 86, 72, 0.28); color: var(--text); }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(237, 234, 226, 0.16); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(237, 234, 226, 0.28); }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 400 12.5px/1.45 var(--font-sans);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }
      :focus-visible {
        outline: 1.5px solid var(--emerald);
        outline-offset: 2px;
      }
      .layout {
        display: grid;
        grid-template-columns: 356px 1fr;
        height: 100vh;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .hdr {
        padding: 12px 14px 10px;
        border-bottom: 1px solid var(--border);
      }
      .hdr-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
        letter-spacing: 0.04em;
        font-size: 12px;
        color: var(--text);
      }
      .brand span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--crimson);
        display: inline-block;
      }
      .back-link {
        color: var(--muted);
        text-decoration: none;
        font-size: 11.5px;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        transition: transform 140ms var(--ease-out), color 140ms ease, border-color 140ms ease;
      }
      .back-link:active { transform: scale(0.97); }
      @media (hover: hover) and (pointer: fine) {
        .back-link:hover { color: var(--text); border-color: var(--border-strong); }
      }
      .sub { color: var(--muted); font-size: 11px; margin-top: 5px; line-height: 1.4; }
      .controls {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        display: grid;
        gap: 8px;
      }
      .ctrl-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: 11.5px;
        color: var(--muted);
      }
      select {
        width: 100%;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: 5px;
        padding: 4px 8px;
        font: 400 11.5px/1.3 var(--font-sans);
        transition: border-color 140ms ease;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--emerald);
        margin: 4px 0 0;
        height: 4px;
        cursor: pointer;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        appearance: none;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 3px 8px;
        font: 500 11px/1.25 var(--font-sans);
        cursor: pointer;
        transition: transform 140ms var(--ease-out), background-color 140ms ease, color 140ms ease, border-color 140ms ease;
      }
      .chip:active { transform: scale(0.97); }
      @media (hover: hover) and (pointer: fine) {
        .chip:hover {
          color: var(--text);
          border-color: var(--border-strong);
          background: rgba(237, 234, 226, 0.04);
        }
      }
      .chip.active {
        border-color: rgba(237, 234, 226, 0.34);
        color: var(--bg);
        background: var(--text);
      }
      .site-list {
        flex: 1;
        overflow-y: auto;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .card {
        background: transparent;
        border-bottom: 1px solid var(--border);
        padding: 9px 14px;
        cursor: pointer;
        transition: background-color 140ms ease;
      }
      @media (hover: hover) and (pointer: fine) {
        .card:hover { background: rgba(237, 234, 226, 0.04); }
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        font: 500 12.5px/1.35 var(--font-jp);
        color: var(--text);
      }
      .tag {
        font: 400 10px/1.2 var(--font-mono);
        padding: 1px 6px;
        border-radius: 4px;
        white-space: nowrap;
        border: 1px solid var(--border-strong);
        color: var(--muted);
        background: rgba(237, 234, 226, 0.04);
      }
      .tag-vanished { color: #eb9a90; border-color: rgba(207, 86, 72, 0.35); background: rgba(207, 86, 72, 0.10); }
      .tag-confirmed { color: #8fd4b8; border-color: rgba(82, 173, 140, 0.38); background: rgba(82, 173, 140, 0.11); }
      .confirm-row {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-top: 6px;
      }
      .cbtn {
        font-size: 10.5px;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid var(--border-strong);
        background: var(--panel-2);
        color: var(--muted);
        cursor: pointer;
        font-weight: 500;
        transition: transform 140ms var(--ease-out), border-color 140ms ease, color 140ms ease;
      }
      .cbtn:active { transform: scale(0.97); }
      @media (hover: hover) and (pointer: fine) {
        .cbtn:hover { border-color: var(--emerald); color: var(--text); }
      }
      .cbtn.active { background: rgba(82,173,140,0.2); border-color: var(--emerald); color: var(--text); }
      .cbtn.rej.active { background: rgba(207,86,72,0.22); border-color: var(--crimson); color: var(--text); }
      .gt-strip {
        margin-top: 7px;
        padding: 5px 8px;
        border-radius: 5px;
        background: rgba(82, 173, 140, 0.07);
        border: 1px solid rgba(82, 173, 140, 0.22);
        font: 400 10.5px/1.3 var(--font-mono);
        color: #9dd8c0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
      }
      .tag-temple { color: #9bc5de; border-color: rgba(107,168,201,0.32); }
      .tag-school { color: #dfc48d; border-color: rgba(212,155,75,0.32); }
      .tag-shrine { color: #e6b48c; border-color: rgba(212,130,85,0.32); }
      .tag-haison { color: #d6c89a; border-color: rgba(196,178,118,0.32); }
      .tag-castle { color: #e2b494; border-color: rgba(214,134,84,0.35); }
      .tag-mound { color: #94d2c5; border-color: rgba(76,175,158,0.35); }
      .tag-lidar { color: #96d4b9; border-color: rgba(82,173,140,0.35); }
      .cond-ruin { color: var(--emerald); font-weight: 500; }
      .cond-bldg { color: var(--amber); }
      .card-meta { color: var(--muted); font-size: 11px; margin-top: 3px; line-height: 1.4; }

      /* Right workspace: top toolbar + 1/2/4-pane map matrix + bottom archive deep-link bar */
      .workspace {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        overflow: hidden;
      }
      .topbar {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 7px 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .mode-group, .preset-group {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .pane-grid {
        display: grid;
        width: 100%;
        height: 100%;
        gap: 1px;
        background: var(--border-strong);
      }
      .pane-grid.mode-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
      .pane-grid.mode-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
      .pane-grid.mode-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
      .pane {
        position: relative;
        width: 100%;
        height: 100%;
        background: #0d0f0e;
        overflow: hidden;
      }
      .pane.hidden { display: none; }
      .pane-map { width: 100%; height: 100%; }
      .pane-hud {
        position: absolute;
        top: 8px;
        left: 44px;
        right: 8px;
        z-index: 650;
        display: flex;
        align-items: center;
        gap: 5px;
        pointer-events: none;
      }
      .pane-hud select {
        pointer-events: auto;
        width: auto;
        max-width: min(320px, calc(100% - 34px));
        background: rgba(21, 24, 22, 0.90);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--border-strong);
        font-size: 11px;
        padding: 3px 10px 3px 7px;
      }
      .pane-badge {
        background: rgba(21, 24, 22, 0.90);
        border: 1px solid var(--border-strong);
        color: var(--muted);
        font: 500 10px/1.2 var(--font-mono);
        padding: 3px 6px;
        border-radius: 4px;
      }
      /* Precision hairline crosshair */
      .crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 16px;
        height: 16px;
        margin-left: -8px;
        margin-top: -8px;
        z-index: 620;
        pointer-events: none;
      }
      .crosshair::before, .crosshair::after {
        content: "";
        position: absolute;
        background: rgba(207, 86, 72, 0.72);
      }
      .crosshair::before { left: 7.5px; top: 0; width: 1px; height: 16px; }
      .crosshair::after { top: 7.5px; left: 0; width: 16px; height: 1px; }

      .archive-bar {
        background: var(--panel);
        border-top: 1px solid var(--border);
        padding: 6px 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
      }
      .archive-links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .archive-links a {
        color: var(--muted);
        text-decoration: none;
        padding: 2px 7px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 4px;
        transition: transform 140ms var(--ease-out), border-color 140ms ease, color 140ms ease;
      }
      .archive-links a:active { transform: scale(0.97); }
      @media (hover: hover) and (pointer: fine) {
        .archive-links a:hover { border-color: var(--border-strong); color: var(--text); }
      }

      .leaflet-control-zoom {
        border: 1px solid var(--border-strong) !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28) !important;
        border-radius: 5px !important;
        overflow: hidden;
      }
      .leaflet-control-zoom a {
        background: rgba(21, 24, 22, 0.90) !important;
        color: var(--text) !important;
        width: 26px !important;
        height: 26px !important;
        line-height: 26px !important;
        font-size: 14px !important;
      }
      .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border-strong);
      }
      .leaflet-popup-content a { color: var(--cyan); }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; grid-template-rows: 42vh 58vh; }
        .workspace { height: 58vh; }
      }
      @media (prefers-reduced-motion: reduce) {
        .chip, .back-link, .cbtn, .archive-links a {
          transition: background-color 140ms ease, color 140ms ease !important;
        }
        .chip:active, .back-link:active, .cbtn:active, .archive-links a:active {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <div class="hdr">
          <div class="hdr-top">
            <div class="brand"><span aria-hidden="true"></span> PALIMPSEST ATLAS</div>
            <div style="display:flex;gap:6px;">
              <a class="back-link" href="./" onclick="if(location.hostname==='127.0.0.1'||location.hostname==='localhost')this.href='./japan_map.html'">← Map</a>
              <a class="back-link" id="nav-voter-link" style="display:none;color:var(--cyan)" href="./symbol_labeler_r6.html">9-Class Deck →</a>
            </div>
          </div>
          <div class="gt-strip" id="atlas-gt-strip">
            <span>Corpus: loading…</span>
          </div>
        </div>

        <div class="controls">
          <div>
            <div class="ctrl-row">
              <label for="overlay-select">Overlay</label>
              <span id="op-val" style="font-family:var(--font-mono);color:var(--text)">45%</span>
            </div>
            <select id="overlay-select"></select>
            <input type="range" id="overlay-opacity" min="0" max="100" value="45" aria-label="Overlay opacity" />
          </div>

          <div class="ctrl-row">
            <label for="ruin-filter">Filter</label>
            <select id="ruin-filter" style="width:auto;font-size:11px;padding:2px 6px">
              <option value="all">All Sites</option>
              <option value="pure_ruin">Sub-Canopy (&gt;25 m)</option>
            </select>
          </div>

          <div class="chips" id="region-chips">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="confirmed">Verified</button>
            <button class="chip" data-filter="shizuoka_100km2">Shizuoka</button>
            <button class="chip" data-filter="vanished_torii">⛩ Shrines</button>
            <button class="chip" data-filter="vanished_manji">卍 Temples</button>
            <button class="chip" data-filter="vanished_bun">文 Schools</button>
            <button class="chip" data-filter="haison">Mines / Haison</button>
            <button class="chip" data-filter="castle_ruin">Castles</button>
            <button class="chip" data-filter="burial_mound">∴ Mounds</button>
            <button class="chip" data-filter="linear_earthwork">Earthworks</button>
            <button class="chip" data-filter="megalith_iwakura">Iwakura</button>
            <button class="chip" data-filter="lidar">0.5 m LiDAR</button>
            <button class="chip" data-filter="shrine">廃神社</button>
          </div>
        </div>

        <div class="site-list" id="site-list"></div>
      </aside>

      <main class="workspace">
        <div class="topbar">
          <div class="mode-group" id="mode-btns">
            <span style="color:var(--muted);font-size:11px;margin-right:2px">Layout</span>
            <button class="chip" data-mode="1">Single</button>
            <button class="chip" data-mode="2">Dual</button>
            <button class="chip active" data-mode="4">Quad</button>
          </div>
          <div class="preset-group" id="preset-btns">
            <span style="color:var(--muted);font-size:11px;margin-right:2px">Presets</span>
            <button class="chip active" data-preset="shrine_hunt">Meiji · 1938 · 1 m LiDAR · Ortho</button>
            <button class="chip" data-preset="epochs4">4-Epoch Topo</button>
            <button class="chip" data-preset="aerials4">4-Epoch Aerials</button>
            <button class="chip" data-preset="terrain4">Terrain &amp; Slope</button>
            <button class="chip" id="btn-warper-scan" title="Query H-GIS / UC Berkeley MapWarper for georeferenced historical sheets in current view">H-GIS Sheet</button>
          </div>
        </div>

        <div class="pane-grid mode-4" id="pane-grid">
          <div class="pane" id="pane-0">
            <div class="pane-hud"><span class="pane-badge">A</span><select class="pane-layer-sel" data-pane="0" aria-label="Pane A layer"></select></div>
            <div class="crosshair"></div>
            <div class="pane-map" id="map-0"></div>
          </div>
          <div class="pane" id="pane-1">
            <div class="pane-hud"><span class="pane-badge">B</span><select class="pane-layer-sel" data-pane="1" aria-label="Pane B layer"></select></div>
            <div class="crosshair"></div>
            <div class="pane-map" id="map-1"></div>
          </div>
          <div class="pane" id="pane-2">
            <div class="pane-hud"><span class="pane-badge">C</span><select class="pane-layer-sel" data-pane="2" aria-label="Pane C layer"></select></div>
            <div class="crosshair"></div>
            <div class="pane-map" id="map-2"></div>
          </div>
          <div class="pane" id="pane-3">
            <div class="pane-hud"><span class="pane-badge">D</span><select class="pane-layer-sel" data-pane="3" aria-label="Pane D layer"></select></div>
            <div class="crosshair"></div>
            <div class="pane-map" id="map-3"></div>
          </div>
        </div>

        <div class="archive-bar">
          <div style="font-family:ui-monospace,monospace;color:var(--muted)" id="center-readout">
            Center: 34.77200, 137.95500 (z=15)
          </div>
          <div class="archive-links" id="center-links"></div>
        </div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      // Nationwide 36 Confirmed / Reported Abandoned Shrines (`廃神社`), Mine Shrines (`鉱山神社`) & Abandoned Villages (`廃村`)
      const NATIONWIDE_CORPUS = [
        { id: "C01", group: "shrine", title: "京都・稲荷山麓の廃社 (Confirmed #1)", lat: 34.974967, lon: 135.779256, note: "Confirmed abandoned shrine; steep 18.3° hillside with cut 6.6° pad & stone stairs." },
        { id: "C02", group: "shrine", title: "千葉・長生一宮の廃神社 (Confirmed #2)", lat: 35.476391, lon: 140.385605, note: "Confirmed abandoned coastal-plain grove shrine." },
        { id: "C03", group: "shrine", title: "広島・廿日市の廃神社 (Confirmed #3)", lat: 34.338972, lon: 132.026194, note: "Confirmed forested mountain shrine (34°20'20.3\"N 132°01'34.3\"E)." },
        { id: "C04", group: "shrine", title: "茨城・ひたちなかの廃神社 (Confirmed #4)", lat: 36.46798, lon: 140.58891, note: "Confirmed overgrown shrine precinct." },
        { id: "C05", group: "shrine", title: "千葉・香取の廃神社 (Confirmed #5)", lat: 35.88960, lon: 140.43085, note: "Confirmed forested bluff shrine in Katori." },
        { id: "V01", group: "shrine", title: "京都・醍醐山中の社跡", lat: 34.95157, lon: 135.79226, note: "Forested Fushimi/Daigo hillside shrine candidate." },
        { id: "V02", group: "shrine", title: "茨城・稲敷の廃社候補", lat: 35.90331, lon: 140.40126, note: "17.9° bluff cut down to 7.3° terrace; no modern GSI ⛩ symbol." },
        { id: "V03", group: "shrine", title: "天宮瀑神社 (Tengunotaki Shrine)", lat: 34.03435, lon: 131.26879, note: "Near Onoda, Yamaguchi; forest path with weathered torii." },
        { id: "V04", group: "haison", title: "山神社 (Near Hanawa / Kosaka Mine)", lat: 40.33951, lon: 140.75154, note: "Abandoned rural/mining mountain shrine in Kazuno, Akita." },
        { id: "V05", group: "shrine", title: "志和間稲荷神社 (Shiwamae Inari)", lat: 40.13979, lon: 140.80859, note: "Kazuno/Hanawa wooden shrine structure in overgrown forest." },
        { id: "V06", group: "shrine", title: "熊本・高森の廃神社", lat: 32.8538, lon: 131.1585, note: "Aso/Takamori forested shrine site." },
        { id: "S07", group: "shrine", title: "勝立山の廃神社 (Ōmuta)", lat: 33.01844, lon: 130.47607, note: "Forested mountain-named abandoned shrine near Ōmuta coal region." },
        { id: "S08", group: "haison", title: "山神社・旧清越鉱山跡 (Izu, Shizuoka)", lat: 34.90156, lon: 138.82171, note: "Wooden mine-tutelary Yama Jinja on forested hillside at closed Seikoshi gold/silver mine." },

      function nearestKjReg(lat, lon) {
        for (const reg of KJ_REGIONS) {
          const b = reg.bbox;
          if (b && lat >= b[0] && lat <= b[1] && lon >= b[2] && lon <= b[3]) return reg;
        }
        let best = KJ_REGIONS[2], bestD = 999;
        for (const reg of KJ_REGIONS) {
          const d = Math.hypot(lat - reg.lat, lon - reg.lon);
          if (d < 1.15 && d < bestD) { bestD = d; best = reg; }
        }
        return best;
      }

      const KjDynamicLayer = L.TileLayer.extend({
        _kjUrlForEpoch: function(coords, epoch) {
          let z = this._getZoomForUrl();
          const n = Math.pow(2, z);
          const lon = (coords.x / n) * 360 - 180;
          const lat = (Math.atan(Math.sinh(Math.PI * (1 - (2 * coords.y) / n))) * 180) / Math.PI;
          const reg = nearestKjReg(lat, lon);
          let tx = coords.x, ty = coords.y;
          if (reg.maxNative && z > reg.maxNative) {
            const shift = z - reg.maxNative;
            z = reg.maxNative; tx = tx >> shift; ty = ty >> shift;
          }
          const tmsY = (1 << z) - ty - 1;
          return `https://ktgis.net/kjmapw/kjtilemap/${reg.folder}/${epoch}/${z}/${tx}/${tmsY}.png`;
        },
        getTileUrl: function(coords) {
          return this._kjUrlForEpoch(coords, this.options.epoch);
        },
        createTile: function(coords, done) {
          const tile = document.createElement("img");
          L.DomEvent.on(tile, "load", L.Util.bind(this._tileOnLoad, this, done, tile));
          const chain = this.options.epoch === "2man" ? ["00", "01"] : (this.options.epoch === "00" ? ["01"] : []);
          let fallbackIdx = 0;
          tile.onerror = () => {
            if (fallbackIdx < chain.length) {
              tile.src = this._kjUrlForEpoch(coords, chain[fallbackIdx++]);
            } else {
              this._tileOnError(done, tile, new Error("tile missing"));
            }
          };
          if (this.options.crossOrigin || this.options.crossOrigin === "") {
            tile.crossOrigin = this.options.crossOrigin === true ? "" : this.options.crossOrigin;
          }
          tile.alt = "";
          tile.setAttribute("role", "presentation");
          tile.src = this.getTileUrl(coords);
          return tile;
        }
      });

      // Live z=17 1m Airborne LiDAR Red-Relief / CS立体図 Canvas Decoder (`dem1a_png` -> automatic `dem5a_png` z=15 fallback!)
      const GsiDemRedReliefLayer = L.GridLayer.extend({
        createTile: function(coords, done) {
          const canvas = document.createElement("canvas");
          canvas.width = 256; canvas.height = 256;
          const ctx = canvas.getContext("2d");
          const z = coords.z;
          const metersPerPx = (40075016.686 * Math.cos((34.77 * Math.PI) / 180)) / (256 * Math.pow(2, Math.min(z, 17)));

          const renderElevationImg = (img, sx, sy, sw, sh, scaleFactor) => {
            const tmp = document.createElement("canvas");
            tmp.width = 256; tmp.height = 256;
            const tctx = tmp.getContext("2d");
            tctx.imageSmoothingEnabled = false;
            tctx.drawImage(img, sx, sy, sw, sh, 0, 0, 256, 256);
            const src = tctx.getImageData(0, 0, 256, 256).data;
            const elev = new Float32Array(256 * 256);
            let valid = 0;
            for (let i = 0; i < 65536; i++) {
              const r = src[i * 4], g = src[i * 4 + 1], b = src[i * 4 + 2];
              if (r === 128 && g === 0 && b === 0) { elev[i] = NaN; continue; }
              let v = (r << 16) | (g << 8) | b;
              if (v >= 0x800000) v -= 0x1000000;
              elev[i] = v * 0.01;
              valid++;
            }
            if (valid < 64) return false;
            const out = ctx.createImageData(256, 256);
            const dst = out.data;
            const dx = metersPerPx * scaleFactor;
            for (let y = 0; y < 256; y++) {
              const ym = Math.max(0, y - 1), yp = Math.min(255, y + 1);
              const y2m = Math.max(0, y - 3), y2p = Math.min(255, y + 3);
              for (let x = 0; x < 256; x++) {
                const idx = y * 256 + x;
                const h0 = elev[idx];
                if (Number.isNaN(h0)) { dst[idx * 4 + 3] = 0; continue; }
                const xm = Math.max(0, x - 1), xp = Math.min(255, x + 1);
                const x2m = Math.max(0, x - 3), x2p = Math.min(255, x + 3);
                const hl = elev[y * 256 + xm], hr = elev[y * 256 + xp];
                const hu = elev[ym * 256 + x], hd = elev[yp * 256 + x];
                const gx = (Number.isNaN(hr) || Number.isNaN(hl)) ? 0 : (hr - hl) / (2 * dx);
                const gy = (Number.isNaN(hd) || Number.isNaN(hu)) ? 0 : (hd - hu) / (2 * dx);
                const slopeDeg = (Math.atan(Math.hypot(gx, gy)) * 180) / Math.PI;
                // Local convexity / openness proxy (ridge/platform edge bright ivory, ditch/cut dark indigo-red, steep scarp crimson!)
                const nbrMean = 0.25 * (
                  (Number.isNaN(elev[y * 256 + x2m]) ? h0 : elev[y * 256 + x2m]) +
                  (Number.isNaN(elev[y * 256 + x2p]) ? h0 : elev[y * 256 + x2p]) +
                  (Number.isNaN(elev[y2m * 256 + x]) ? h0 : elev[y2m * 256 + x]) +
                  (Number.isNaN(elev[y2p * 256 + x]) ? h0 : elev[y2p * 256 + x])
                );
                const conv = Math.max(-1.5, Math.min(1.5, (h0 - nbrMean) / Math.max(0.6, dx * 0.9)));
                // NW hillshade + Chiba Red Relief blend: flat leveled terraces pop bright warm ivory against crimson scarps!
                const shade = Math.max(0.15, Math.min(1.15, 0.78 - 0.35 * gx - 0.35 * gy + 0.22 * conv));
                const sNorm = Math.min(1.0, slopeDeg / 40.0);
                dst[idx * 4]     = Math.min(255, Math.max(0, Math.round((248 - 35 * sNorm) * shade)));
                dst[idx * 4 + 1] = Math.min(255, Math.max(0, Math.round((242 - 168 * sNorm) * shade)));
                dst[idx * 4 + 2] = Math.min(255, Math.max(0, Math.round((226 - 185 * sNorm) * shade)));
                dst[idx * 4 + 3] = 255;
              }
            }
            ctx.putImageData(out, 0, 0);
            return true;
          };

          const tryDem5a = () => {
            const z5 = Math.min(z, 15);
            const shift = z - z5;
            const x5 = coords.x >> shift, y5 = coords.y >> shift;
            const sub = 1 << shift;
            const sw = 256 / sub;
            const sx = (coords.x - (x5 << shift)) * sw;
            const sy = (coords.y - (y5 << shift)) * sw;
            const im5 = new Image();
            im5.crossOrigin = "anonymous";
            im5.onload = () => { renderElevationImg(im5, sx, sy, sw, sw, 1.0); done(null, canvas); };
            im5.onerror = () => done(null, canvas);
            im5.src = `https://cyberjapandata.gsi.go.jp/xyz/dem5a_png/${z5}/${x5}/${y5}.png`;
          };

          if (z >= 14) {
            const z1 = Math.min(z, 17);
            const shift = z - z1;
            const x1 = coords.x >> shift, y1 = coords.y >> shift;
            const sub = 1 << shift;
            const sw = 256 / sub;
            const sx = (coords.x - (x1 << shift)) * sw;
            const sy = (coords.y - (y1 << shift)) * sw;
            const im1 = new Image();
            im1.crossOrigin = "anonymous";
            im1.onload = () => {
              if (!renderElevationImg(im1, sx, sy, sw, sw, 1.0)) tryDem5a();
              else done(null, canvas);
            };
            im1.onerror = tryDem5a;
            im1.src = `https://cyberjapandata.gsi.go.jp/xyz/dem1a_png/${z1}/${x1}/${y1}.png`;
          } else {
            tryDem5a();
          }
          return canvas;
        }
      });

      function buildOptionsHtml(includeNone) {
        const groups = {};
        for (const item of LAYER_CATALOG) {
          (groups[item.group] = groups[item.group] || []).push(item);
        }
        let html = includeNone ? `<option value="none">None (No Overlay on Pane A)</option>` : "";
        for (const [gName, arr] of Object.entries(groups)) {
          html += `<optgroup label="${gName}">`;
          for (const it of arr) html += `<option value="${it.id}">${it.label}</option>`;
          html += `</optgroup>`;
        }
        return html;
      }

      // Initialize 4 synchronized Leaflet panes
      const maps = [];
      const paneBaseLayers = [null, null, null, null];
      const markerGroups = [];
      const shizuokaBounds = [[34.7259, 137.8966], [34.8172, 138.0072]];

      for (let i = 0; i < 4; i++) {
        const m = L.map(`map-${i}`, {
          center: [34.772, 137.955],
          zoom: 15,
          maxZoom: 19,
          zoomControl: i === 0,
          attributionControl: i === 0 || i === 3
        });
        L.rectangle(shizuokaBounds, { color: "#34d399", weight: 1.8, fillOpacity: 0.015, dashArray: "6 4" }).addTo(m);
        maps.push(m);
        markerGroups.push(L.layerGroup().addTo(m));
      }

      function makeLayerById(id) {
        const spec = LAYER_CATALOG.find((x) => x.id === id) || LAYER_CATALOG[0];
        return spec.make();
      }

      const paneSelects = document.querySelectorAll(".pane-layer-sel");
      const defaults = ["kj_2man", "kj_01", "lidar_cs1m", "esri_sat"];
      paneSelects.forEach((sel, idx) => {
        sel.innerHTML = buildOptionsHtml(false);
        sel.value = defaults[idx];
        paneBaseLayers[idx] = makeLayerById(defaults[idx]).addTo(maps[idx]);
        sel.addEventListener("change", () => setPaneLayer(idx, sel.value));
      });

      let pane0Overlay = null;
      const ovSel = document.getElementById("overlay-select");
      ovSel.innerHTML = buildOptionsHtml(true);
      ovSel.value = "none";
      const opInput = document.getElementById("overlay-opacity");
      const opVal = document.getElementById("op-val");
      opVal.textContent = opInput.value + "%";

      function setPaneLayer(idx, layerId) {
        if (paneBaseLayers[idx]) maps[idx].removeLayer(paneBaseLayers[idx]);
        paneBaseLayers[idx] = makeLayerById(layerId).addTo(maps[idx]);
        document.querySelector(`.pane-layer-sel[data-pane="${idx}"]`).value = layerId;
        if (idx === 0 && pane0Overlay) pane0Overlay.bringToFront();
      }

      ovSel.addEventListener("change", () => {
        if (pane0Overlay) { maps[0].removeLayer(pane0Overlay); pane0Overlay = null; }
        if (ovSel.value !== "none") {
          pane0Overlay = makeLayerById(ovSel.value).setOpacity(Number(opInput.value) / 100).addTo(maps[0]);
        }
      });
      opInput.addEventListener("input", () => {
        opVal.textContent = opInput.value + "%";
        if (pane0Overlay) pane0Overlay.setOpacity(Number(opInput.value) / 100);
      });

      // Lockstep Pan/Zoom Synchronization across all visible panes!
      let isSyncing = false;
      function updateArchiveBar() {
        const c = maps[0].getCenter();
        const z = maps[0].getZoom();
        const lat = c.lat.toFixed(5), lon = c.lng.toFixed(5);
        document.getElementById("center-readout").textContent = `${lat}, ${lon} · z${z}`;
        const d = 0.015;
        const reg = nearestKjReg(c.lat, c.lng);
        document.getElementById("center-links").innerHTML = `
          <a href="https://heritagemap.nabunken.go.jp/?lat=${lat}&lng=${lon}&zoom=16.0&bearing=0.0&pitch=0.0" target="_blank" rel="noopener">文化財総覧 ↗</a>
          <a href="https://maps.qchizu.jp/#17/${lat}/${lon}/&base=pale&ls=pale%7Cdem1a_cs&disp=11" target="_blank" rel="noopener">Q地図 1m CS ↗</a>
          <a href="https://ktgis.net/kjmapw/kjmapw.html?lat=${lat}&lng=${lon}&zoom=16&dataset=${reg.folder}&age=0&screen=2" target="_blank" rel="noopener">今昔マップ ↗</a>
          <a href="https://service.gsi.go.jp/map-photos/?lat=${lat}&lon=${lon}&zoom=15" target="_blank" rel="noopener">GSI 原図・写真 ↗</a>
          <a href="https://mapwarper.h-gis.jp/maps/geosearch?bbox=${(c.lng-d).toFixed(4)},${(c.lat-d).toFixed(4)},${(c.lng+d).toFixed(4)},${(c.lat+d).toFixed(4)}" target="_blank" rel="noopener">H-GIS ↗</a>
          <a href="https://maps.gsi.go.jp/#17/${lat}/${lon}/&base=ort&ls=ort%7Chillshademap&disp=11" target="_blank" rel="noopener">地理院地図 ↗</a>
          <a href="https://www.google.com/maps/@?api=1&map_action=map&center=${lat},${lon}&zoom=18&basemap=satellite" target="_blank" rel="noopener">Satellite ↗</a>
        `;
      }

      maps.forEach((srcMap, idx) => {
        srcMap.on("move", () => {
          if (isSyncing) return;
          isSyncing = true;
          const c = srcMap.getCenter();
          const z = srcMap.getZoom();
          maps.forEach((dst, j) => {
            if (j !== idx) dst.setView(c, z, { animate: false });
          });
          updateArchiveBar();
          isSyncing = false;
        });

      updateArchiveBar();

        setPaneMode(Number(btn.dataset.mode));

          const url = `https://mapwarper.h-gis.jp/maps/geosearch?bbox=${b.getWest().toFixed(4)},${b.getSouth().toFixed(4)},${b.getEast().toFixed(4)},${b.getNorth().toFixed(4)}&format=json&per_page=15`;

          const j = await r.json();

      function updateGtStrip(summary) {
        if (!summary) return;

          el.innerHTML = `<span><b>${summary.confirmed_positive_count || 318}</b> verified · ${bc.shrine_torii || 0} ⛩ · ${bc.temple_manji || 0} 卍 · ${bc.burial_mound || 0} ∴ · ${bc.castle_ruin || 0} castles · ${bc.mine_quarry || 0} mines</span>${voterHtml}`;

      window.confirmSiteInDataset = async function(itemId, vote) {
        const it = allItems.find(x => x.id === itemId);
        if (!it) return;
        const reg = nearestKjReg(it.lat, it.lon);
        const curVote = it.humanVote === vote ? "CLEAR" : vote;
        it.humanVote = curVote === "CLEAR" ? null : curVote;
        if (it.humanVote === "T") { it.group = "vanished_torii"; it.humanConfirmed = true; it.humanLabel = "CONFIRMED ⛩ SHRINE"; }
        else if (it.humanVote === "M") { it.group = "vanished_manji"; it.humanConfirmed = true; it.humanLabel = "CONFIRMED 卍 TEMPLE"; }
        else if (it.humanVote === "B") { it.group = "vanished_bun"; it.humanConfirmed = true; it.humanLabel = "CONFIRMED 文 SCHOOL"; }
        else if (it.humanVote === "K") { it.group = "haison"; it.humanConfirmed = true; it.humanLabel = "CONFIRMED ⚒ MINE"; }
        else if (it.humanVote === "C") { it.group = "castle_ruin"; it.humanConfirmed = true; it.humanLabel = "CONFIRMED ⛫ CASTLE"; }
        else if (it.humanVote === "G") { it.group = "burial_mound"; it.humanConfirmed = true; it.humanLabel = "CONFIRMED ∴ MOUND"; }
        else if (it.humanVote === "N") { it.humanConfirmed = false; it.humanLabel = "REJECTED (✕)"; }
        else { it.humanConfirmed = false; it.humanLabel = null; }
        renderItems();
        if (!location.hostname.endsWith("github.io")) {
          try {
            const src = it.humanCode && it.humanCode.startsWith("M") ? "r4" : (it.humanCode && it.humanCode.startsWith("V") ? "r3" : "atlas");
            const res = await fetch("/api/vote", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                source: src,
                code: it.humanCode || it.id,
                vote: curVote,
                lat: it.lat,
                lon: it.lon,
                region_folder: reg.folder,
                region_short: reg.folder,
                title: it.title
              })
            });
            const js = await res.json();
            if (js.ok) updateGtStrip(js.summary);
          } catch (_) {}
        }
      };

              <a href="https://ktgis.net/kjmapw/kjmapw.html?lat=${lat}&lng=${lon}&zoom=16&dataset=${reg.folder}&age=0&screen=2" target="_blank" rel="noopener">今昔マップ ↗</a>

      let activeFilter = "all";
      let ruinOnly = false;

      const markerById = new Map();

      function renderItems() {
        markerGroups.forEach((mg) => mg.clearLayers());
        markerById.clear();
        const listEl = document.getElementById("site-list");
        listEl.innerHTML = "";

        const filtered = allItems.filter((it) => {
          if (it.humanVote === "N") return false;
          if (ruinOnly && it.distBldg !== undefined && it.distBldg <= 25) return false;
          if (activeFilter === "all") return true;
          if (activeFilter === "confirmed") return it.humanConfirmed === true;
          if (activeFilter === "shizuoka_100km2") return it.in100km2 === true;
          return it.group === activeFilter;
        });

        for (const it of filtered) {
          const color =
            it.group === "vanished_torii" ? "#f43f5e" :
            it.group === "vanished_manji" ? "#38bdf8" :
            it.group === "vanished_bun" ? "#fbbf24" :
            it.group === "castle_ruin" ? "#fb923c" :
            it.group === "burial_mound" ? "#2dd4bf" :
            it.group === "linear_earthwork" ? "#a3e635" :
            it.group === "megalith_iwakura" ? "#e879f9" :
            it.group === "lidar" ? "#34d399" :
            it.group === "haison" ? "#facc15" : "#f59e0b";

          let primaryMarker = null;
          markerGroups.forEach((mg, idx) => {
            const m = L.circleMarker([it.lat, it.lon], {
              radius: (it.group.startsWith("vanished") || it.group === "castle_ruin" || it.group === "burial_mound") ? 6.5 : 5.5,
              color: "#0b0f16",
              weight: 1.5,
              fillColor: color,
              fillOpacity: 0.9
            });
            if (idx === 0) {
              m.bindPopup(popupHtml(it), { autoPanPaddingTopLeft: [16, 48], autoPanPaddingBottomRight: [16, 16] });
              primaryMarker = m;
              if (it.id) markerById.set(String(it.id), m);
              if (it.humanCode) markerById.set(String(it.humanCode), m);
            }
            m.on("click", () => {
              maps[0].flyTo([it.lat, it.lon], Math.max(maps[0].getZoom(), 16), { duration: 0.5 });
              if (primaryMarker) primaryMarker.openPopup();
            });
            m.addTo(mg);
          });

          const card = document.createElement("div");
          card.className = "card";
          const tagCls = it.humanConfirmed ? "tag-confirmed" : (
            it.group === "vanished_torii" ? "tag-vanished" :
            it.group === "vanished_manji" ? "tag-temple" :
            it.group === "vanished_bun" ? "tag-school" :
            it.group === "castle_ruin" ? "tag-castle" :
            it.group === "burial_mound" ? "tag-mound" :
            it.group === "lidar" ? "tag-lidar" :
            it.group === "haison" ? "tag-haison" : "tag-shrine");
          const tagLbl = it.humanLabel || (
            it.group === "vanished_torii" ? "⛩ Shrine" :
            it.group === "vanished_manji" ? "卍 Temple" :
            it.group === "vanished_bun" ? "文 School" :
            it.group === "castle_ruin" ? "Castle" :
            it.group === "burial_mound" ? "∴ Mound" :
            it.group === "linear_earthwork" ? "Earthwork" :
            it.group === "megalith_iwakura" ? "Iwakura" :
            it.group === "lidar" ? "0.5m LiDAR" :
            it.group === "haison" ? "Mine / Haison" : "Shrine");
          const codePrefix = (it.humanCode || it.id) ? `${it.humanCode || it.id} · ` : "";
          const bldgBadge = it.distBldg !== undefined
            ? ` · <span class="${it.distBldg > 25 ? 'cond-ruin' : 'cond-bldg'}">${it.distBldg > 25 ? '>' + it.distBldg + 'm' : it.distBldg + 'm'}</span>`
            : "";
          card.innerHTML = `
            <div class="card-top">
              <span>${it.title}</span>
              <span class="tag ${tagCls}">${tagLbl}</span>
            </div>
            <div class="card-meta" style="font-family:var(--font-mono);font-size:10.5px">${codePrefix}${it.lat.toFixed(4)}, ${it.lon.toFixed(4)}${bldgBadge}</div>
            ${confirmButtonsHtml(it)}
          `;
          card.addEventListener("click", () => {
            maps[0].flyTo([it.lat, it.lon], 16, { duration: 0.55 });
          });
          listEl.appendChild(card);
        }
      }

      document.getElementById("ruin-filter").addEventListener("change", (e) => {
        ruinOnly = e.target.value === "pure_ruin";
        renderItems();
      });

      document.getElementById("region-chips").addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        for (const b of document.querySelectorAll("#region-chips .chip")) b.classList.toggle("active", b === btn);
        activeFilter = btn.dataset.filter;
        if (activeFilter === "shizuoka_100km2" || activeFilter.startsWith("vanished") || activeFilter === "lidar") {
          maps[0].flyTo([34.772, 137.952], 13, { duration: 0.65 });
        } else if (activeFilter === "haison" || activeFilter === "shrine") {
          maps[0].flyTo([36.3, 137.8], 6, { duration: 0.65 });
        }
        renderItems();
      });

      // Dynamically load verified Round-2/3 Pre-WW2 ⛩/卍/文/⛏, Confirmed Human Ground Truth & 0.5m LiDAR discoveries!
      async function loadDynamicCatalogs() {
        for (const base of ["./data", "../experiments/shrines/colab_outputs", "."]) {
          try {
            const r = await fetch(`${base}/historical_kyuhanzu_catalog.json`, { cache: "no-store" });
            if (r.ok) {
              const hj = await r.json();
              const vanItems = [];
              for (const [idx, v] of (hj.vanished_candidates || []).slice(0, 1000).entries()) {
                const grp =
                  v.kind === "shrine_torii" ? "vanished_torii" :
                  v.kind === "temple_manji" ? "vanished_manji" :
                  v.kind === "castle_ruin" ? "castle_ruin" :
                  v.kind === "burial_mound" ? "burial_mound" :
                  v.kind === "linear_earthwork" ? "linear_earthwork" :
                  v.kind === "megalith_iwakura" ? "megalith_iwakura" :
                  (v.kind === "mine_quarry" || v.kind === "haison_industrial") ? "haison" : "vanished_bun";
                const sym =
                  v.kind === "shrine_torii" ? "⛩ Shrine" :
                  v.kind === "temple_manji" ? "卍 Temple" :
                  v.kind === "castle_ruin" ? "Castle" :
                  v.kind === "burial_mound" ? "∴ Mound" :
                  v.kind === "linear_earthwork" ? "Earthwork" :
                  v.kind === "megalith_iwakura" ? "Iwakura" :
                  v.kind === "haison_industrial" ? "Haison" :
                  v.kind === "mine_quarry" ? "Mine" : "文 School";
                const hv =
                  v.human_verified ? (
                    v.kind === "shrine_torii" ? "T" :
                    v.kind === "temple_manji" ? "M" :
                    v.kind === "castle_ruin" ? "C" :
                    v.kind === "burial_mound" ? "G" :
                    v.kind === "linear_earthwork" ? "R" :
                    v.kind === "megalith_iwakura" ? "I" :
                    v.kind === "haison_industrial" ? "H" :
                    v.kind === "mine_quarry" ? "K" : "B"
                  ) : null;
                const cleanTitle = v.wikidata_name || `${sym}${v.region_folder ? " (" + v.region_folder + ")" : ""}`;
                const ocr = (v.ocr_kanji_nearby && v.ocr_kanji_nearby.length) ? ` · OCR: ${v.ocr_kanji_nearby.slice(0,2).join("/")}` : "";
                const mdlTag = !v.human_verified ? (
                  v.model_source ? ` · ${v.model_source}` : ""
                ) : "";
                const qaExtra = v.qa_note ? ` · ${v.qa_note}` : "";
                vanItems.push({
                  id: v.human_code || v.discovery_id || `VAN-${idx+1}`,
                  humanCode: v.human_code || v.discovery_id || null,
                  humanConfirmed: Boolean(v.human_verified),
                  humanVote: hv,
                  humanLabel: v.human_verified ? "Verified" : null,
                  group: grp,
                  in100km2: v.in100km2 !== undefined ? Boolean(v.in100km2) : true,
                  distBldg: v.dist_gsi_bldg_m,
                  title: cleanTitle,
                  lat: v.lat,
                  lon: v.lon,
                  note: `Score=${Number(v.consensus_score || 0.85).toFixed(2)}${mdlTag}${ocr}${qaExtra}`
                });
              }
              allItems.unshift(...vanItems);
              break;
            }
          } catch {}
        }

        // Load authoritative human-confirmed ground-truth dataset (`confirmed_human_dataset.json`) across ALL regions!
        try {
          const rGt = await fetch(`./data/confirmed_human_dataset.json?t=${Date.now()}`, { cache: "no-store" });
          if (rGt.ok) {
            const gt = await rGt.json();
            updateGtStrip(gt);
            const extraConfirmed = [];
            for (const p of (gt.confirmed_sites || [])) {
              const dup = allItems.find(it =>
                (p.code && it.humanCode === p.code) ||
                Math.hypot((it.lat - p.lat) * 111000, (it.lon - p.lon) * 91000) < 50
              );
              if (dup) {
                dup.humanConfirmed = true;
                dup.humanVote = p.human_vote;
                dup.humanCode = p.code;
                dup.humanLabel = "Verified";
                if (p.confirmed_class === "shrine_torii") dup.group = "vanished_torii";
                else if (p.confirmed_class === "temple_manji") dup.group = "vanished_manji";
                else if (p.confirmed_class === "school_bun") dup.group = "vanished_bun";
                else if (p.confirmed_class === "castle_ruin") dup.group = "castle_ruin";
                else if (p.confirmed_class === "burial_mound") dup.group = "burial_mound";
                else if (p.confirmed_class === "mine_quarry") dup.group = "haison";
              } else {
                const grp =
                  p.confirmed_class === "shrine_torii" ? "vanished_torii" :
                  p.confirmed_class === "temple_manji" ? "vanished_manji" :
                  p.confirmed_class === "castle_ruin" ? "castle_ruin" :
                  p.confirmed_class === "burial_mound" ? "burial_mound" :
                  p.confirmed_class === "mine_quarry" ? "haison" : "vanished_bun";
                extraConfirmed.push({
                  id: p.id,
                  humanCode: p.code,
                  humanConfirmed: true,
                  humanVote: p.human_vote,
                  humanLabel: "Verified",
                  group: grp,
                  in100km2: p.region_folder === "hamamatsu",
                  title: p.site_name || `${String(p.confirmed_label || "").replace(/[⚒🪨🏚⛫]/g, "").trim()} (${p.region_short || p.region_folder})`,
                  lat: p.lat,
                  lon: p.lon,
                  note: `${p.round} human-confirmed ground truth · Epoch: ${p.epoch || "hist"} · ${p.modern_status || ""}`
                });
              }
            }
            if (extraConfirmed.length) allItems.push(...extraConfirmed);
          }
        } catch {}

        for (const base of ["./data", "../experiments/shrines/colab_outputs", "."]) {
          try {
            const r = await fetch(`${base}/lidar_shrine_benchmark.json`, { cache: "no-store" });
            if (r.ok) {
              const lj = await r.json();
              for (const [idx, d] of (lj.top_unmapped_100km2_shrine_leads || []).slice(0, 25).entries()) {
                if (d.lat && d.lon) {
                  const f = d.features || {};
                  allItems.push({
                    id: d.id || `LID-${idx+1}`,
                    group: "lidar",
                    in100km2: true,
                    title: `0.5m LiDAR Shrine Lead ${d.id || idx+1} (p=${d.shrine_prob})`,
                    lat: d.lat,
                    lon: d.lon,
                    note: `Unmapped terrace · Slope ${f.bg_slope_deg}°→${f.pad_slope_deg}° · Pad ${f.best_pad_w_m}×${f.best_pad_d_m}m · CHM ${f.chm_p95_20m}m`
                  });
                }
              }
              break;
            }
          } catch {}
        }

        for (const base of ["./data", "../experiments/shrines/colab_outputs", "."]) {
          try {
            const r = await fetch(`${base}/shizuoka_castle_mound_leads.json`, { cache: "no-store" });
            if (r.ok) {
              const cj = await r.json();
              for (const item of (cj.items || [])) {
                const dup = allItems.find(it =>
                  (item.code && it.humanCode === item.code) ||
                  Math.hypot((it.lat - item.lat) * 111000, (it.lon - item.lon) * 91000) < 60
                );
                if (!dup) {
                  allItems.push({
                    id: item.code || item.id,
                    humanCode: item.code || null,
                    group: item.group,
                    in100km2: Boolean(item.in100km2),
                    title: item.title,
                    lat: item.lat,
                    lon: item.lon,
                    note: item.note
                  });
                }
              }
              break;
            }
          } catch {}
        }
        renderItems();
        if (location.hash && location.hash.startsWith("#")) {
          const parts = location.hash.slice(1).split("/");
          if (parts.length >= 3) {
            const hz = Number(parts[0]), hlat = Number(parts[1]), hlon = Number(parts[2]);
            const hcode = parts[3] ? decodeURIComponent(parts[3]) : "";
            if (!Number.isNaN(hlat) && !Number.isNaN(hlon)) {
              maps[0].setView([hlat, hlon], Number.isNaN(hz) ? 17 : hz);
            }
          }
        }
      }

      renderItems();
      loadDynamicCatalogs();
    </script>
  </body>
</html>
